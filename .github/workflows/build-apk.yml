name: Build YPod APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/ypod-os-2-personalizado, feature/ypod-music-classic-3]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "y" | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Android 2.3 manifest and launcher
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/ypod-manifest.txt
          grep -Fq "package: name='com.pocketbeat.ypodclassic'" /tmp/ypod-manifest.txt
          grep -Fq "sdkVersion:'10'" /tmp/ypod-manifest.txt
          grep -Fq "launchable-activity: name='com.pocketbeat.player.ClassicActivity'" /tmp/ypod-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YPod-Music-Classic-APK
          path: app/build/outputs/apk/debug/*.apk

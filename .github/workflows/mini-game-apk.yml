name: Build Y-Dino for Galaxy Y

on:
  push:
    branches: [main, ypod-mini-game-galaxy-y]
    paths:
      - 'mini-game/**'
      - '.github/workflows/mini-game-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-28" "build-tools;35.0.0"
      - name: Build Android 2.3.6 APK
        run: bash mini-game/build.sh
      - name: Verify APK package and minimum SDK
        shell: bash
        run: |
          APK="mini-game/build/outputs/YPod-Y-Dino-Galaxy-Y.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/y-dino-badging.txt
          grep -Fq "package: name='com.ypod.ydino'" /tmp/y-dino-badging.txt
          grep -Fq "sdkVersion:'10'" /tmp/y-dino-badging.txt
      - name: Publish Y-Dino APK
        uses: actions/upload-artifact@v4
        with:
          name: Y-Dino-v1.0-APK
          path: mini-game/build/outputs/*.apk
          if-no-files-found: error

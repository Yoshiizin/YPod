name: Build Mini Home Galaxy Y
on:
  push:
    branches: [ypod-mini-home-galaxy-y]
    paths:
      - 'mini-home/**'
      - '.github/workflows/mini-home-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-28" "build-tools;35.0.0"
      - name: Build signed API-10 APK
        run: bash mini-home/build.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: YPod-Mini-Home-Galaxy-Y
          path: mini-home/build/outputs/*.apk
          if-no-files-found: error

name: Build Mini Home Galaxy Y
on:
  push:
    branches: [ypod-mini-home-galaxy-y]
    paths:
      - 'mini-home/**'
      - '.github/workflows/mini-home-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-28" "build-tools;35.0.0"
      - name: Build signed API-10 APK
        run: bash mini-home/build.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: YPod-Mini-Home-Galaxy-Y
          path: mini-home/build/outputs/*.apk
          if-no-files-found: error
